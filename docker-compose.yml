services:services:
  backend:
    build: ./backend
    image: bring-ideas-backend:latest
    ports:
      - "8000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy

  fronted:
    build: ./frontend
    image: bring-ideas-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend

